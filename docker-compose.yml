# Portunus 部署编排（单镜像版：前端 + 后端一体）
# 直接 `docker compose up -d`，访问 http://localhost:3060 即 Web 管理后台。
#
# 宿主机 3060 同时承载：
#   - http://localhost:3060/          Web 管理后台
#   - http://localhost:3060/api/*     管理 API（前端同源，无需 CORS）
#   - http://localhost:3060/v1/*      LLM 网关（claude code / codex base_url 填 http://localhost:3060）
#
# 镜像已发布到 Docker Hub（amd64 + arm64），首次运行自动拉取，无需本地构建。
# 本地改了代码想重新构建时，取消 build: 段注释即可（build 优先于 image）。

services:
  portunus:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    #   args:
    #     GOPROXY: https://goproxy.cn,direct
    image: lijx559/portunus:latest
    container_name: portunus
    restart: unless-stopped
    environment:
      # 清空 Docker CLI 从 ~/.docker/config.json 自动注入的宿主代理
      # （容器内 127.0.0.1:7890 不可达，会导致所有上游调用失败）
      HTTP_PROXY: ''
      HTTPS_PROXY: ''
      http_proxy: ''
      https_proxy: ''
      ALL_PROXY: ''
      all_proxy: ''
    ports:
      - '3060:80'
    volumes:
      # 数据目录：SQLite 数据库。换到任意位置改左侧宿主机路径即可，右侧保持 /app/data
      - ./data:/app/data